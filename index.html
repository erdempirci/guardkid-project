<script>
  // URL'deki rastgele token'ı al (/t/k8M9x2P4 ise k8M9x2P4'ü çeker)
  const pathParts = window.location.pathname.split('/');
  const token = pathParts.includes('t') ? pathParts[pathParts.indexOf('t') + 1] : 'k8M9x2P4';

  fetch(`/api/profile?token=${token}`)
    .then(r => {
      if(!r.ok) throw new Error();
      return r.json();
    })
    .then(d => {
      if (d) {
        document.getElementById('dispToken').innerText = `Kimlik No: ${d.token || token}`;
        if (d.childName) document.getElementById('dispName').innerText = d.childName;
        if (d.bloodGroup) document.getElementById('dispBlood').innerText = d.bloodGroup;
        if (d.allergies) document.getElementById('dispAllergies').innerText = d.allergies;
        if (d.chronicCondition) document.getElementById('dispChronic').innerText = d.chronicCondition;
        if (d.instruction) document.getElementById('dispInstruction').innerText = d.instruction;
        if (d.medications) document.getElementById('dispMeds').innerText = d.medications;
        if (d.motherPhone) document.getElementById('dispMom').href = `tel:${d.motherPhone}`;
        if (d.fatherPhone) document.getElementById('dispDad').href = `tel:${d.fatherPhone}`;
      }
    })
    .catch(() => {
      document.getElementById('dispName').innerText = "Geçersiz Bileklik";
      document.getElementById('dispInstruction').innerText = "Bu bileklik kodu sistemde bulunamadı.";
    });
</script>
