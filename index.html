<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardKid Medical ID</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 16px; min-height: 100vh; }
    .container { width: 100%; max-width: 440px; background: #1e293b; border-radius: 20px; padding: 20px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
    
    /* Sekme Butonları */
    .tab-bar { display: flex; width: 100%; max-width: 440px; background: #0b1329; border-radius: 12px; padding: 4px; margin-bottom: 16px; border: 1px solid #334155; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    /* Medikal Kart Stilleri */
    .med-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #dc2626; padding-bottom: 12px; margin-bottom: 16px; }
    .med-logo { font-weight: 800; font-size: 18px; color: #ef4444; }
    .med-badge { background: #dc2626; color: white; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; }
    .critical-box { background: #450a0a; border: 1.5px solid #ef4444; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
    .crit-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .crit-label { font-size: 12px; text-transform: uppercase; color: #fca5a5; font-weight: 700; }
    .crit-val { font-size: 14px; font-weight: 800; color: #fff; }
    .blood-tag { background: #ef4444; color: white; padding: 2px 8px; border-radius: 6px; font-weight: 900; }
    .instruction-card { background: #0f172a; border-left: 4px solid #f59e0b; border-radius: 0 12px 12px 0; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #fbbf24; }
    .detail-card { background: #0f172a; border-radius: 14px; padding: 14px; margin-bottom: 16px; border: 1px solid #334155; }
    .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
    .data-row:last-child { border-bottom: none; }
    .data-label { color: #94a3b8; }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-contact { background: #2563eb; color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; text-align: center; }
    .btn-112 { background: #dc2626; grid-column: span 2; }

    /* Form Stilleri */
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    .input-group input, .input-group select, .input-group textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; color: #fff; font-size: 14px; }
    .btn-save { width: 100%; background: #10b981; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Üst Sekmeler -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('view')">👁️ Bileklik Görünümü</button>
    <button class="tab-btn" onclick="showTab('edit')">⚙️ Bilgileri Düzenle</button>
  </div>

  <!-- 1. BİLEKLİK GÖRÜNÜMÜ -->
  <div id="viewSection" class="container">
    <div class="med-header">
      <div class="med-logo">⚕️ GuardKid Medical ID</div>
      <span class="med-badge">ACİL TIBBİ KART</span>
    </div>

    <div class="critical-box">
      <div class="crit-row">
        <span class="crit-label">Kan Grubu:</span>
        <span class="crit-val blood-tag" id="dispBlood">A Rh+</span>
      </div>
      <div class="crit-row">
        <span class="crit-label">Ağır Alerjiler:</span>
        <span class="crit-val" id="dispAllergies" style="color: #fca5a5;">Penisilin, Fıstık</span>
      </div>
      <div class="crit-row">
        <span class="crit-label">Kronik Tanı:</span>
        <span class="crit-val" id="dispChronic">Tip-1 Diyabet</span>
      </div>
    </div>

    <div class="instruction-card">
      <strong>⚠️ Talimat:</strong> <span id="dispInstruction">Bilinç kapalıysa derhal 112'yi arayınız.</span>
    </div>

    <div class="detail-card">
      <div class="data-row"><span class="data-label">Hasta:</span><span id="dispName" style="font-weight:bold;">Ali (6 Yaş)</span></div>
      <div class="data-row"><span class="data-label">İlaçlar:</span><span id="dispMeds">İnsülin</span></div>
    </div>

    <div class="contact-grid">
      <a id="dispMom" href="tel:+905528326213" class="btn-contact">📞 Anne (Ara)</a>
      <a id="dispDad" href="tel:+905528326213" class="btn-contact">📞 Baba (Ara)</a>
      <a href="tel:112" class="btn-contact btn-112">🚑 112 Acil Servis</a>
    </div>
  </div>

  <!-- 2. DÜZENLEME PANELİ -->
  <div id="editSection" class="container" style="display: none;">
    <h3 style="margin-bottom: 16px; color: #38bdf8;">⚙️ Ebeveyn Bilgi Güncelleme</h3>
    
    <div class="input-group">
      <label>Hasta Adı & Yaşı</label>
      <input type="text" id="inName" value="Ali (6 Yaş)">
    </div>
    <div class="input-group">
      <label>Kan Grubu</label>
      <select id="inBlood">
        <option value="A Rh+">A Rh+</option>
        <option value="A Rh-">A Rh-</option>
        <option value="B Rh+">B Rh+</option>
        <option value="0 Rh+">0 Rh+</option>
        <option value="0 Rh-">0 Rh-</option>
        <option value="AB Rh+">AB Rh+</option>
      </select>
    </div>
    <div class="input-group">
      <label>Alerjiler</label>
      <input type="text" id="inAllergies" value="Penisilin, Fıstık (Anafilaksi)">
    </div>
    <div class="input-group">
      <label>Kronik Durum</label>
      <input type="text" id="inChronic" value="Tip-1 Diyabet (İnsülin)">
    </div>
    <div class="input-group">
      <label>İlk Yardım Talimatı</label>
      <textarea id="inInstruction" rows="2">Bilinç kapalıysa çantasındaki EpiPen'i uygulayın.</textarea>
    </div>
    <div class="input-group">
      <label>İlaçlar</label>
      <input type="text" id="inMeds" value="İnsülin">
    </div>
    <div class="input-group">
      <label>Anne Telefonu</label>
      <input type="tel" id="inMom" value="+905528326213">
    </div>
    <div class="input-group">
      <label>Baba Telefonu</label>
      <input type="tel" id="inDad" value="+905528326213">
    </div>

    <button class="btn-save" onclick="saveData()">💾 Kaydet & Kartı Güncelle</button>
  </div>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(tab === 'view') {
        document.getElementById('viewSection').style.display = 'block';
        document.getElementById('editSection').style.display = 'none';
        event.target.classList.add('active');
      } else {
        document.getElementById('viewSection').style.display = 'none';
        document.getElementById('editSection').style.display = 'block';
        event.target.classList.add('active');
      }
    }

    function saveData() {
      const data = {
        name: document.getElementById('inName').value,
        blood: document.getElementById('inBlood').value,
        allergies: document.getElementById('inAllergies').value,
        chronic: document.getElementById('inChronic').value,
        instruction: document.getElementById('inInstruction').value,
        meds: document.getElementById('inMeds').value,
        mom: document.getElementById('inMom').value,
        dad: document.getElementById('inDad').value
      };
      localStorage.setItem('gk_profile', JSON.stringify(data));
      loadData();
      alert('✅ Bilgiler güncellendi!');
      showTab('view');
    }

    function loadData() {
      const saved = localStorage.getItem('gk_profile');
      if(saved) {
        const d = JSON.parse(saved);
        document.getElementById('dispName').innerText = d.name;
        document.getElementById('dispBlood').innerText = d.blood;
        document.getElementById('dispAllergies').innerText = d.allergies;
        document.getElementById('dispChronic').innerText = d.chronic;
        document.getElementById('dispInstruction').innerText = d.instruction;
        document.getElementById('dispMeds').innerText = d.meds;
        document.getElementById('dispMom').href = `tel:${d.mom}`;
        document.getElementById('dispDad').href = `tel:${d.dad}`;
      }
    }
    window.onload = loadData;
  </script>
</body>
</html>
