<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardKid - Ebeveyn Yönetimi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; display: flex; justify-content: center; padding: 16px; min-height: 100vh; }
    .container { width: 100%; max-width: 440px; background: #ffffff; border-radius: 20px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h3 { margin-bottom: 16px; color: #0f172a; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 4px; }
    .input-group input, .input-group select, .input-group textarea { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; color: #0f172a; font-size: 14px; font-family: inherit; }
    .btn-save { width: 100%; background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 15px; }
    .btn-save:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h3>⚙️ Ebeveyn Sağlık Paneli</h3>

    <div class="input-group">
      <label>Çocuğun Adı</label>
      <input type="text" id="name" placeholder="Örn: Ali">
    </div>

    <div class="row-2">
      <div class="input-group">
        <label>Yaş</label>
        <input type="number" id="age" placeholder="Örn: 6">
      </div>
      <div class="input-group">
        <label>Kilo (Doz Hesabı İçin)</label>
        <input type="number" id="weight" placeholder="Örn: 22">
      </div>
    </div>

    <div class="input-group">
      <label>Kan Grubu</label>
      <input type="text" id="blood" placeholder="Örn: A Rh+">
    </div>

    <div class="input-group">
      <label>Ağır / Anafilaktik Alerjiler</label>
      <input type="text" id="allergies" placeholder="Örn: Penisilin, Fıstık">
    </div>

    <div class="input-group">
      <label>Kronik Tanı</label>
      <input type="text" id="chronic" placeholder="Örn: Tip-1 Diyabet">
    </div>

    <div class="input-group">
      <label>İlk Müdahale Direktifi</label>
      <textarea id="instruction" rows="2" placeholder="Örn: EpiPen çantasındadır..."></textarea>
    </div>

    <div class="input-group">
      <label>Kullandığı İlaçlar</label>
      <input type="text" id="meds" placeholder="Örn: Lantus İnsülin">
    </div>

    <div class="input-group">
      <label>Tıbbi Cihaz / İmplant</label>
      <input type="text" id="device" placeholder="Örn: Sürekli Glikoz Monitörü (CGM)">
    </div>

    <div class="row-2">
      <div class="input-group">
        <label>Anne Tel</label>
        <input type="tel" id="mom" placeholder="+905...">
      </div>
      <div class="input-group">
        <label>Baba Tel</label>
        <input type="tel" id="dad" placeholder="+905...">
      </div>
    </div>

    <button class="btn-save" onclick="save()">💾 Değişiklikleri Doğrula & Kaydet</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || 'k8M9x2P4';

    fetch(`/api/profile?token=${token}`).then(r => r.json()).then(d => {
      if(d && !d.error) {
        document.getElementById('name').value = d.childName || '';
        document.getElementById('age').value = d.age || '';
        document.getElementById('weight').value = d.weight || '';
        document.getElementById('blood').value = d.bloodGroup || '';
        document.getElementById('allergies').value = d.allergies || '';
        document.getElementById('chronic').value = d.chronicCondition || '';
        document.getElementById('instruction').value = d.instruction || '';
        document.getElementById('meds').value = d.medications || '';
        document.getElementById('device').value = d.device || '';
        document.getElementById('mom').value = d.motherPhone || '';
        document.getElementById('dad').value = d.fatherPhone || '';
      }
    });

    function save() {
      fetch('/api/profile', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          token: token,
          childName: document.getElementById('name').value,
          age: document.getElementById('age').value,
          weight: document.getElementById('weight').value,
          bloodGroup: document.getElementById('blood').value,
          allergies: document.getElementById('allergies').value,
          chronicCondition: document.getElementById('chronic').value,
          instruction: document.getElementById('instruction').value,
          medications: document.getElementById('meds').value,
          device: document.getElementById('device').value,
          motherPhone: document.getElementById('mom').value,
          fatherPhone: document.getElementById('dad').value,
          updatedAt: new Date().toISOString()
        })
      }).then(() => alert('✅ Medikal profil ve doğrulama tarihi güncellendi!'));
    }
  </script>
</body>
</html>
