name: GuardKid 100+ Cyber Attack & Vulnerability Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  owasp-zap-dast-attack-scan:
    name: Canlı Site 100+ Atak Simülasyonu (OWASP Pentest)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: OWASP ZAP 100+ Atak Pentestini Başlat
        run: |
          docker run --rm ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://guardkid-project.vercel.app \
            -m 1 \
            -I || true
