name: GuardKid 100+ Cyber Attack & Vulnerability Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  static-security-scan:
    name: 1. Statik Kod & Sızıntı Analizi (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Gizli Anahtar ve Token Sızıntı Taraması
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  owasp-zap-dast-attack-scan:
    name: 2. Canlı Site 100+ Atak Simülasyonu (OWASP DAST Pentest)
    runs-on: ubuntu-latest
    needs: static-security-scan
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: OWASP 100+ Atak Paketi ile Canlı URL'yi Test Et
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://guardkid-project.vercel.app'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
