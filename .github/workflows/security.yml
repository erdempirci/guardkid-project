name: GuardKid 100+ Cyber Attack & Vulnerability Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  owasp-zap-dast-attack-scan:
    name: Canlı Site 100+ Atak Simülasyonu (OWASP Pentest)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: OWASP 100+ Atak Paketi ile Canlı URL'yi Test Et
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://guardkid-project.vercel.app'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-security-report'
          cmd_options: '-m 1'
