<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardKid Medical ID</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 16px; min-height: 100vh; }
    .container { width: 100%; max-width: 440px; background: #1e293b; border-radius: 20px; padding: 20px; border: 1px solid #334155; }
    .med-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #dc2626; padding-bottom: 12px; margin-bottom: 16px; }
    .med-logo { font-weight: 800; font-size: 18px; color: #ef4444; }
    .med-badge { background: #dc2626; color: white; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; }
    .critical-box { background: #450a0a; border: 1.5px solid #ef4444; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
    .crit-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .crit-label { font-size: 12px; text-transform: uppercase; color: #fca5a5; font-weight: 700; }
    .crit-val { font-size: 14px; font-weight: 800; color: #fff; }
    .blood-tag { background: #ef4444; color: white; padding: 2px 8px; border-radius: 6px; font-weight: 900; }
    .instruction-card { background: #0f172a; border-left: 4px solid #f59e0b; border-radius: 0 12px 12px 0; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #fbbf24; }
    .detail-card { background: #0f172a; border-radius: 14px; padding: 14px; margin-bottom: 16px; border: 1px solid #334155; }
    .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
    .data-row:last-child { border-bottom: none; }
    .data-label { color: #94a3b8; }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-contact { background: #2563eb; color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; text-align: center; }
    .btn-112 { background: #dc2626; grid-column: span 2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="med-header">
      <div class="med-logo">⚕️ GuardKid Medical ID</div>
      <span class="med-badge">ACİL TIBBİ KART</span>
    </div>
    <div class="critical-box">
      <div class="crit-row"><span class="crit-label">Kan Grubu:</span><span class="crit-val blood-tag" id="dispBlood">A Rh+</span></div>
      <div class="crit-row"><span class="crit-label">Ağır Alerjiler:</span><span class="crit-val" id="dispAllergies" style="color: #fca5a5;">Penisilin, Fıstık</span></div>
      <div class="crit-row"><span class="crit-label">Kronik Tanı:</span><span class="crit-val" id="dispChronic">Tip-1 Diyabet</span></div>
    </div>
    <div class="instruction-card">
      <strong>⚠️ İlk Yardım Notu:</strong> <span id="dispInstruction">Bilinç kapalıysa derhal 112'yi arayınız.</span>
    </div>
    <div class="detail-card">
      <div class="data-row"><span class="data-label">Hasta:</span><span id="dispName" style="font-weight:bold;">Ali (6 Yaş)</span></div>
      <div class="data-row"><span class="data-label">İlaçlar:</span><span id="dispMeds">İnsülin</span></div>
    </div>
    <div class="contact-grid">
      <a id="dispMom" href="tel:+905528326213" class="btn-contact">📞 Anne (Ara)</a>
      <a id="dispDad" href="tel:+905528326213" class="btn-contact">📞 Baba (Ara)</a>
      <a href="tel:112" class="btn-contact btn-112">🚑 112 Acil Servis</a>
    </div>
  </div>
  <script>
    fetch('/api/profile').then(r => r.json()).then(d => {
      if(d) {
        document.getElementById('dispBlood').innerText = d.bloodGroup;
        document.getElementById('dispAllergies').innerText = d.allergies;
        document.getElementById('dispChronic').innerText = d.chronicCondition;
        document.getElementById('dispInstruction').innerText = d.instruction;
        document.getElementById('dispName').innerText = d.childName;
        document.getElementById('dispMeds').innerText = d.medications;
        document.getElementById('dispMom').href = `tel:${d.motherPhone}`;
        document.getElementById('dispDad').href = `tel:${d.fatherPhone}`;
      }
    });
  </script>
</body>
</html>
