<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardKid Medical ID - Tıbbi Acil Durum Profili</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 16px; min-height: 100vh; }
    .container { width: 100%; max-width: 440px; background: #1e293b; border-radius: 20px; padding: 20px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .med-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #dc2626; padding-bottom: 12px; margin-bottom: 16px; }
    .med-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: #ef4444; }
    .med-badge { background: #dc2626; color: white; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; }

    .critical-box { background: #450a0a; border: 1.5px solid #ef4444; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
    .crit-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .crit-row:last-child { margin-bottom: 0; }
    .crit-label { font-size: 12px; text-transform: uppercase; color: #fca5a5; font-weight: 700; }
    .crit-val { font-size: 15px; font-weight: 800; color: #fff; }
    .blood-tag { background: #ef4444; color: white; padding: 2px 8px; border-radius: 6px; font-weight: 900; }

    .instruction-card { background: #0f172a; border-left: 4px solid #f59e0b; border-radius: 0 12px 12px 0; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #fbbf24; line-height: 1.4; }

    .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; }
    .detail-card { background: #0f172a; border-radius: 14px; padding: 14px; margin-bottom: 16px; border: 1px solid #334155; }
    .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
    .data-row:last-child { border-bottom: none; }
    .data-label { color: #94a3b8; }
    .data-val { font-weight: 600; color: #f8fafc; }

    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .btn-contact { background: #2563eb; color: white; text-decoration: none; padding: 14px 8px; border-radius: 12px; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
    .btn-112 { background: #dc2626; grid-column: span 2; }
    .btn-contact:active { opacity: 0.8; }
  </style>
</head>
<body>

<div class="container">
  <div class="med-header">
    <div class="med-logo">
      <span>⚕️</span> GuardKid Medical ID
    </div>
    <span class="med-badge">ACİL TIBBİ KART</span>
  </div>

  <div class="critical-box">
    <div class="crit-row">
      <span class="crit-label">Kan Grubu:</span>
      <span class="crit-val blood-tag" id="dispBlood">A Rh+</span>
    </div>
    <div class="crit-row" style="margin-top: 6px;">
      <span class="crit-label">Ağır Alerjiler:</span>
      <span class="crit-val" id="dispAllergies" style="color: #fca5a5;">-</span>
    </div>
    <div class="crit-row" style="margin-top: 6px;">
      <span class="crit-label">Kronik Tanı:</span>
      <span class="crit-val" id="dispChronic">-</span>
    </div>
  </div>

  <div class="instruction-card">
    <strong>⚠️ İlk Yardım Talimatı:</strong> <span id="dispInstruction">-</span>
  </div>

  <div class="section-title">Hasta Bilgisi</div>
  <div class="detail-card">
    <div class="data-row">
      <span class="data-label">Hasta / Çocuk:</span>
      <span class="data-val" id="dispName">-</span>
    </div>
    <div class="data-row">
      <span class="data-label">Kullandığı İlaçlar:</span>
      <span class="data-val" id="dispMeds">-</span>
    </div>
    <div class="data-row">
      <span class="data-label">Bileklik Kodu:</span>
      <span class="data-val" id="dispToken" style="color: #38bdf8;">GK-8492</span>
    </div>
  </div>

  <div class="section-title">Acil Durum İletişim (ICE)</div>
  <div class="contact-grid">
    <a id="callMomBtn" href="tel:" class="btn-contact">📞 Anne (Ara)</a>
    <a id="callDadBtn" href="tel:" class="btn-contact">📞 Baba (Ara)</a>
    <a href="tel:112" class="btn-contact btn-112">🚑 112 Acil Servis</a>
  </div>
</div>

<script>
  window.onload = function() {
    fetch('/api/profile')
      .then(res => res.json())
      .then(data => {
        if(data) {
          document.getElementById('dispBlood').innerText = data.bloodGroup || 'Bilinmiyor';
          document.getElementById('dispAllergies').innerText = data.allergies || 'Yok';
          document.getElementById('dispChronic').innerText = data.chronicCondition || 'Yok';
          document.getElementById('dispInstruction').innerText = data.instruction || 'Belirtilmedi.';
          document.getElementById('dispName').innerText = data.childName || 'Anonim';
          document.getElementById('dispMeds').innerText = data.medications || 'Yok';
          document.getElementById('dispToken').innerText = data.token || 'GK-8492';

          if(data.motherPhone) document.getElementById('callMomBtn').href = `tel:${data.motherPhone}`;
          if(data.fatherPhone) document.getElementById('callDadBtn').href = `tel:${data.fatherPhone}`;
        }
      })
      .catch(err => console.log(err));
  };
</script>
</body>
</html>
