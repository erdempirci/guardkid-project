<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardKid - Okul Yoklama Paneli</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --green: #10b981;
      --green-soft: #ecfdf5;
      --blue: #2563eb;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .status-badge { background: var(--green-soft); color: var(--green); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }

    .scanner-box { background: var(--card-bg); border: 2px dashed var(--blue); border-radius: 16px; padding: 20px 16px; text-align: center; margin-bottom: 16px; }
    .btn-action { background: var(--blue); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; font-size: 15px; }
    .manual-input { display: flex; gap: 8px; margin-top: 10px; }
    .manual-input input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    .manual-input button { background: #334155; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }

    .list-title { font-size: 13px; font-weight: 800; text-transform: uppercase; color: #64748b; margin: 16px 0 8px 4px; }
    .log-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .log-left { display: flex; align-items: center; gap: 10px; }
    .student-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #cbd5e1; }
    .log-name { font-weight: 700; font-size: 15px; }
    .log-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
    .log-time { font-weight: 800; color: var(--green); background: var(--green-soft); padding: 4px 8px; border-radius: 8px; font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">📋 GuardKid Yoklama</div>
    <div class="status-badge" id="countBadge">Mevcut: 0</div>
  </div>

  <div class="scanner-box">
    <div style="font-size: 36px; margin-bottom: 4px;">📡</div>
    <h3 style="font-size: 16px;">NFC Bilekliği Dokundurun</h3>
    <p style="font-size: 12px; color: #64748b; margin-top: 2px;">(Destekleyen Android cihazlarda Web NFC)</p>
    <button class="btn-action" onclick="startWebNFC()">📲 NFC Okuyucuyu Başlat</button>
    
    <div class="manual-input">
      <input type="text" id="manualToken" placeholder="Token veya Test No (k8M9x2P4)">
      <button onclick="recordAttendance(document.getElementById('manualToken').value)">İşle</button>
    </div>
  </div>

  <div class="list-title">Giriş Yapan Öğrenciler</div>
  <div id="attendanceList"></div>
</div>

<script>
  let logs = [];

  async function recordAttendance(token) {
    if (!token) return;
    try {
      const res = await fetch('/api/attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token.trim(), type: 'IN' })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('manualToken').value = '';
        loadLogs();
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function loadLogs() {
    try {
      const res = await fetch('/api/attendance');
      const data = await res.json();
      if (data.success && data.logs) {
        logs = data.logs;
        renderLogs();
      }
    } catch(e) {}
  }

  function renderLogs() {
    const list = document.getElementById('attendanceList');
    document.getElementById('countBadge').innerText = `Mevcut: ${logs.length}`;
    if (logs.length === 0) {
      list.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px; font-size:14px;">Henüz giriş yapan öğrenci yok.</div>';
      return;
    }
    list.innerHTML = logs.map(l => `
      <div class="log-card">
        <div class="log-left">
          <img class="student-avatar" src="${l.photo || 'https://images.unsplash.com/photo-1543332164-6e82f355badc?w=150&auto=format&fit=crop&q=80'}">
          <div>
            <div class="log-name">${l.name}</div>
            <div class="log-meta">Sınıf: ${l.class} • Fotoğraf Doğrulandı</div>
          </div>
        </div>
        <div class="log-time">${l.time}</div>
      </div>
    `).join('');
  }

  async function startWebNFC() {
    if ("NDEFReader" in window) {
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        alert("✅ NFC Okuyucu Aktif!");
        ndef.onreading = event => {
          const decoder = new TextDecoder();
          for (const record of event.message.records) {
            const text = decoder.decode(record.data);
            const token = text.split('/').filter(Boolean).pop() || "k8M9x2P4";
            recordAttendance(token);
          }
        };
      } catch (error) {
        alert("NFC Hatası: " + error.message);
      }
    } else {
      alert("Bu tarayıcı Web NFC desteklemiyor. Manuel kutudan işlem yapabilirsiniz.");
    }
  }

  loadLogs();
</script>
</body>
</html>
